features:
  translation: true
  knowledge_search: true
  knowledge_answer: true

privacy:
  allow_external_api: false

clipboard:
  min_chars: 3
  max_chars: 20000
  poll_interval_ms: 400
  debounce_ms: 500
  process_plain_text_only: true

knowledge:
  collection: jarvis-wiki
  # New users select this Markdown folder during first-run setup.
  source_path: ""
  limit: 5
  query_timeout_seconds: 20
  max_summary_source_chars: 50000

qmd:
  command: qmd
  index: index
  no_rerank: false
  models:
    # Leave blank to use QMD defaults. Confirmed setup rebuilds vectors after a change.
    embedding: ""
    reranking: ""
    generation: ""

translation:
  provider: ollama
  model: translategemma:4b
  base_url: http://127.0.0.1:11434
  timeout_seconds: 60
  credential_account: translation

summary:
  provider: ollama
  model: qwen3:8b
  base_url: http://127.0.0.1:11434
  timeout_seconds: 120
  credential_account: summary

vision:
  model: qwen2.5vl:7b
  base_url: http://127.0.0.1:11434
  timeout_seconds: 90

actions:
  allowed_bundle_ids:
    - com.apple.Safari
    - com.apple.TextEdit
  # Accessibility titles must exactly match this safe-operation allowlist.
  allowed_accessibility_labels:
    - 刷新按钮
    - Reload this page
    - Refresh
  minimum_confidence: 0.75
  screenshot_max_age_seconds: 5
  confirmation_ttl_seconds: 30

telegram:
  enabled: false
  allowed_user_id: 0
  credential_account: telegram
